name: 三大法人每日自動更新

on:
  schedule:
    # 台灣時間 18:23 = UTC 10:23（盤後抓三大法人 + 收盤價；避開整點以減少 GitHub 排程延遲）
    - cron: '23 10 * * 1-5'
    # 台灣時間 19:47 = UTC 11:47（再抓一次；週五含外資持股比率）
    - cron: '47 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch 三大法人 + 收盤價（週五加抓外資持股）
        run: |
          DOW=$(date +%u)
          # 週五，或延遲到週六才執行（抓的仍是週五交易日）都加抓外資持股
          if [ "$DOW" = "5" ] || [ "$DOW" = "6" ]; then
            python three_laws_tracker.py fetch --holding
          else
            python three_laws_tracker.py fetch
          fi

      - name: Build dashboard
        run: python three_laws_tracker.py build

      - name: Commit & push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "auto: update $(date +'%Y-%m-%d %H:%M %Z')"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Retry $i: push failed, retrying..."
              sleep $((i*5))
            done
          fi
